name: نشر طاولة البطاقات

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: تجهيز ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app

      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@v4
